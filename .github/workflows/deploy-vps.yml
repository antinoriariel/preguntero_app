name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/preguntero.antinori.com.ar

            git config --global --add safe.directory /var/www/preguntero.antinori.com.ar
            git fetch origin
            git reset --hard origin/main

            sudo chown -R www-data:www-data /var/www/preguntero.antinori.com.ar
            sudo find /var/www/preguntero.antinori.com.ar -type d -exec chmod 755 {} \;
            sudo find /var/www/preguntero.antinori.com.ar -type f -exec chmod 644 {} \;

            sudo systemctl reload apache2

            echo "Deploy completado: $(git log -1 --format='%h %s')"